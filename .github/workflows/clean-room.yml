name: Clean-room acceptance

# THE RELEASE ACCEPTANCE OBJECT IS THE INSTALLED PACKAGE, NOT THE LAB.
# A fresh GitHub-hosted runner receives ONLY the release bundle (and the acceptance kit), each fetched
# as an artifact and checked by sha256. NOTHING is checked out from any developer repository and nothing
# is read from the Lab. Chain proven, link by link:
#   release manifest (signature) -> installer / Helm -> images by digest -> configuration contract ->
#   schema -> running product (revisions) -> product acceptance / security smoke -> uninstall
# plus an upgrade/rollback leg between two bundles judged by the EXISTING rollback-equivalence
# comparator (lkg-rollback-equivalence.sh `state`).
# Every leg ends in an explicit verdict; any RED fails the workflow. RED is allowed, false GREEN is not.
#
# OWNER DECISIONS THIS WORKFLOW DEPENDS ON (it fails RED, naming them, until they exist):
#   D5 clean-room identity  -> secrets CLEANROOM_OIDC_ISSUER / _CLIENT_ID / _CLIENT_SECRET / _ROLE_CLAIM / _ROLE_MAPPING
#   D6 distribution         -> secrets GHCR_READ_USER / GHCR_READ_TOKEN (or offline image archives in the bundle)

on:
  workflow_call:
    inputs:
      bundle_artifact: {type: string, required: true}
      bundle_sha256: {type: string, required: true}
      bundle_run_id: {type: string, required: true}
      kit_sha256: {type: string, required: true}
      candidate: {type: boolean, default: false}
      previous_bundle_run_id: {type: string, default: ""}
      previous_bundle_sha256: {type: string, default: ""}
  workflow_dispatch:
    inputs:
      bundle_artifact: {description: "artifact name, e.g. intentgate-2026.09.30-rc0.bundle", required: true}
      bundle_sha256: {description: "sha256 of the bundle archive", required: true}
      bundle_run_id: {description: "run id of the release workflow that produced it", required: true}
      kit_sha256: {description: "sha256 of acceptance-kit.tgz from the same run", required: true}
      candidate: {description: "measure a signed but not-releasable candidate", type: boolean, default: false}
      previous_bundle_run_id: {description: "previous ACCEPTED bundle run id (upgrade/rollback)", default: ""}
      previous_bundle_sha256: {description: "previous ACCEPTED bundle sha256", default: ""}

permissions:
  contents: read
  actions: read

env:
  PROJECT: intentgate
  # The release-key fingerprint, pinned HERE (out of band relative to the bundle under test), equal to
  # intentgate-release-2026-01 in the platform key set / trust anchor (IGRK/1). Never read from the bundle.
  INTENTGATE_RELEASE_KEY_FINGERPRINT: 4efafcb1a932277c6ed355d98034120c699ad0f37c82cd02c90b71b3ad85ba77

jobs:
  compose:
    name: clean-room install (Compose installer, unattended)
    runs-on: ubuntu-24.04
    # D5 identity secrets are ENVIRONMENT secrets of `clean-room` (required reviewer), never repository secrets.
    environment: clean-room
    timeout-minutes: 45
    steps:
      - name: Precondition - the workspace is empty (no checkout of any developer repository)
        run: test -z "$(ls -A "$GITHUB_WORKSPACE")" && echo "CLEAN_WORKSPACE=yes"
      - name: Fetch the bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.bundle_artifact }}
          path: ${{ runner.temp }}/dl
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
      - name: Bundle digest == the digest the release job produced
        run: |
          set -euo pipefail
          f=$(ls "$RUNNER_TEMP"/dl/*.bundle.tgz)
          echo "${{ inputs.bundle_sha256 }}  $f" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ig" && tar -xzf "$f" -C "$RUNNER_TEMP/ig"
          (cd "$RUNNER_TEMP/ig" && sha256sum -c --quiet CHECKSUMS)
          (cd "$RUNNER_TEMP/ig" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/inventory-before.txt"
      - name: Verifier dependency (PyPI only; nothing from developer repositories)
        run: python3 -m pip install --quiet cryptography==46.0.7 jsonschema==4.26.0
      - name: Registry access (owner decision D6)
        env:
          U: ${{ secrets.GHCR_READ_USER }}
          T: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          [ -n "$U" ] && [ -n "$T" ] || { echo "::error::D6 undecided: no GHCR read credential for the clean room (images are private)"; exit 1; }
          echo "$T" | docker login ghcr.io -u "$U" --password-stdin
      - name: Clean-room identity (owner decision D5) - operator keys only; secrets are generated by the installer
        env:
          ISS: ${{ secrets.CLEANROOM_OIDC_ISSUER }}
          CID: ${{ secrets.CLEANROOM_OIDC_CLIENT_ID }}
          CSEC: ${{ secrets.CLEANROOM_OIDC_CLIENT_SECRET }}
          RCL: ${{ secrets.CLEANROOM_ROLE_CLAIM }}
          RMAP: ${{ secrets.CLEANROOM_ROLE_MAPPING }}
        run: |
          set -euo pipefail
          [ -n "$ISS" ] && [ -n "$CID" ] && [ -n "$CSEC" ] && [ -n "$RCL" ] && [ -n "$RMAP" ] \
            || { echo "::error::D5 undecided: no clean-room OIDC identity (test IdP fixture or Entra test tenant)"; exit 1; }
          umask 077
          printf '%s\n' "AUTH_OIDC_ISSUER=$ISS" "AUTH_OIDC_CLIENT_ID=$CID" "AUTH_OIDC_CLIENT_SECRET=$CSEC" \
            "AUTH_ROLE_CLAIM=$RCL" "AUTH_ROLE_MAPPING=$RMAP" "CONSOLE_PRO_PUBLIC_URL=http://127.0.0.1:3000" \
            "INTENTGATE_PUBLIC_GATEWAY_URL=http://127.0.0.1:8080" "INTENTGATE_PLATFORM_GATEWAY_TENANT=cleanroom" > "$RUNNER_TEMP/seed.env"
      - name: Install exactly as a customer does (unattended)
        working-directory: ${{ runner.temp }}/ig
        env:
          INTENTGATE_ENV_SEED: ${{ runner.temp }}/seed.env
          INTENTGATE_ACCEPT_UNRELEASABLE_CANDIDATE: ${{ inputs.candidate && '1' || '' }}
        run: ./install.sh 2>&1 | tee "$RUNNER_TEMP/install.log"; exit "${PIPESTATUS[0]}"
      - name: Provenance chain of the running product (evidence copy)
        if: always()
        working-directory: ${{ runner.temp }}/ig
        run: |
          set -uo pipefail
          python3 release/release-manifest.py collect-facts --manifest release-manifest.json --form compose --project "$PROJECT" \
            --install-dir . --contract release/config-contract.json --out "$RUNNER_TEMP/facts.json"
          python3 release/release-manifest.py verify-install --manifest release-manifest.json --sig release-manifest.json.sig \
            --key-set release/trust/release-key-set.json --pinned-fingerprint "$INTENTGATE_RELEASE_KEY_FINGERPRINT" \
            --contract release/config-contract.json --facts "$RUNNER_TEMP/facts.json" | tee "$RUNNER_TEMP/provenance-chain.txt"
      - name: Product acceptance / security smoke
        if: always()
        working-directory: ${{ runner.temp }}/ig
        run: python3 release/acceptance-smoke.py --manifest release-manifest.json --form compose --project "$PROJECT" | tee "$RUNNER_TEMP/smoke.txt"; exit "${PIPESTATUS[0]}"
      - name: No borrowed files - installed tree == bundle + declared generated files
        if: always()
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/ig" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/inventory-after.txt"
          extra=$(diff <(cut -c67- "$RUNNER_TEMP/inventory-before.txt") <(cut -c67- "$RUNNER_TEMP/inventory-after.txt") | grep '^>' | grep -v '^> ./.env$' || true)
          changed=$(join -j2 <(sort -k2 "$RUNNER_TEMP/inventory-before.txt") <(sort -k2 "$RUNNER_TEMP/inventory-after.txt") | awk '$2!=$3{print $1}')
          [ -z "$extra$changed" ] || { echo "extra: $extra"; echo "changed: $changed"; echo "INVENTORY=RED"; exit 1; }
          echo "INVENTORY=GREEN"
      - name: Uninstall is clean
        if: always()
        working-directory: ${{ runner.temp }}/ig
        run: |
          set -euo pipefail
          docker compose -p "$PROJECT" down -v --remove-orphans
          left=$(docker ps -aq --filter "label=com.docker.compose.project=$PROJECT"; docker volume ls -q --filter "label=com.docker.compose.project=$PROJECT"; docker network ls -q --filter "label=com.docker.compose.project=$PROJECT")
          [ -z "$left" ] || { echo "UNINSTALL=RED leftovers: $left"; exit 1; }
          echo "UNINSTALL=GREEN"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-room-compose-evidence
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/facts.json
            ${{ runner.temp }}/provenance-chain.txt
            ${{ runner.temp }}/smoke.txt
            ${{ runner.temp }}/inventory-*.txt

  helm:
    name: clean-room install (Helm on a kind cluster)
    runs-on: ubuntu-24.04
    # D5 identity secrets are ENVIRONMENT secrets of `clean-room` (required reviewer), never repository secrets.
    environment: clean-room
    timeout-minutes: 45
    steps:
      - name: Precondition - the workspace is empty
        run: test -z "$(ls -A "$GITHUB_WORKSPACE")"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.bundle_artifact }}
          path: ${{ runner.temp }}/dl
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
      - name: Bundle digest, extraction, signature
        run: |
          set -euo pipefail
          f=$(ls "$RUNNER_TEMP"/dl/*.bundle.tgz)
          echo "${{ inputs.bundle_sha256 }}  $f" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ig" && tar -xzf "$f" -C "$RUNNER_TEMP/ig"
          cd "$RUNNER_TEMP/ig" && sha256sum -c --quiet CHECKSUMS
          python3 -m pip install --quiet cryptography==46.0.7 jsonschema==4.26.0
          REQ=--require-releasable; [ "${{ inputs.candidate }}" = "true" ] && REQ=
          python3 release/release-manifest.py verify --manifest release-manifest.json --sig release-manifest.json.sig \
            --key-set release/trust/release-key-set.json --pinned-fingerprint "$INTENTGATE_RELEASE_KEY_FINGERPRINT" $REQ
          python3 release/release-manifest.py verify-bundle --manifest release-manifest.json --bundle-dir .
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - uses: helm/kind-action@v1
        with:
          cluster_name: cleanroom
      - name: Configuration contract -> Secret (D5 identity, generated secrets)
        working-directory: ${{ runner.temp }}/ig
        env:
          ISS: ${{ secrets.CLEANROOM_OIDC_ISSUER }}
          CID: ${{ secrets.CLEANROOM_OIDC_CLIENT_ID }}
          CSEC: ${{ secrets.CLEANROOM_OIDC_CLIENT_SECRET }}
          RCL: ${{ secrets.CLEANROOM_ROLE_CLAIM }}
          RMAP: ${{ secrets.CLEANROOM_ROLE_MAPPING }}
          U: ${{ secrets.GHCR_READ_USER }}
          T: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$ISS" ] && [ -n "$RMAP" ] || { echo "::error::D5 undecided: no clean-room OIDC identity"; exit 1; }
          [ -n "$U" ] && [ -n "$T" ] || { echo "::error::D6 undecided: no registry credential"; exit 1; }
          umask 077
          printf '%s\n' "AUTH_OIDC_ISSUER=$ISS" "AUTH_OIDC_CLIENT_ID=$CID" "AUTH_OIDC_CLIENT_SECRET=$CSEC" "AUTH_ROLE_CLAIM=$RCL" \
            "AUTH_ROLE_MAPPING=$RMAP" "CONSOLE_PRO_PUBLIC_URL=http://127.0.0.1:3000" "INTENTGATE_PUBLIC_GATEWAY_URL=http://127.0.0.1:8080" \
            "INTENTGATE_PLATFORM_GATEWAY_TENANT=cleanroom" > .env
          python3 release/release-manifest.py config-generate --contract release/config-contract.json --env .env
          python3 release/release-manifest.py config-validate --contract release/config-contract.json --env .env --scope helm \
            --facts-out "$RUNNER_TEMP/config-facts.json"
          kubectl create namespace "$PROJECT"
          kubectl -n "$PROJECT" create secret generic intentgate-config --from-env-file=.env
          kubectl -n "$PROJECT" create secret docker-registry ghcr --docker-server=ghcr.io --docker-username="$U" --docker-password="$T"
      - name: helm install (values rendered from the same manifest; digest-only)
        working-directory: ${{ runner.temp }}/ig
        run: |
          set -euo pipefail
          helm install "$PROJECT" helm/intentgate -n "$PROJECT" -f helm/intentgate/values.release.yaml \
            --set 'imagePullSecrets[0].name=ghcr' --set acceptUnreleasableCandidate=${{ inputs.candidate }} --wait --timeout 15m
          helm get manifest "$PROJECT" -n "$PROJECT" > "$RUNNER_TEMP/helm-manifest.yaml"
      - name: Parity - Helm and Compose run the same component -> digest set
        if: always()
        working-directory: ${{ runner.temp }}/ig
        run: |
          set -euo pipefail
          python3 release/release-manifest.py image-refs --kind helm --file "$RUNNER_TEMP/helm-manifest.yaml" > "$RUNNER_TEMP/helm-refs.txt"
          python3 release/release-manifest.py image-refs --kind compose --file docker-compose.yml > "$RUNNER_TEMP/compose-refs.txt"
          if diff "$RUNNER_TEMP/compose-refs.txt" "$RUNNER_TEMP/helm-refs.txt"; then echo "PARITY=GREEN"; else echo "PARITY=RED"; exit 1; fi
      - name: Provenance chain + smoke
        if: always()
        working-directory: ${{ runner.temp }}/ig
        run: |
          set -uo pipefail
          python3 release/release-manifest.py collect-facts --manifest release-manifest.json --form helm --namespace "$PROJECT" \
            --install-dir . --contract release/config-contract.json --config-facts "$RUNNER_TEMP/config-facts.json" --out "$RUNNER_TEMP/facts.json"
          python3 release/release-manifest.py verify-install --manifest release-manifest.json --sig release-manifest.json.sig \
            --key-set release/trust/release-key-set.json --pinned-fingerprint "$INTENTGATE_RELEASE_KEY_FINGERPRINT" \
            --contract release/config-contract.json --facts "$RUNNER_TEMP/facts.json" | tee "$RUNNER_TEMP/provenance-chain.txt"; a=${PIPESTATUS[0]}
          python3 release/acceptance-smoke.py --manifest release-manifest.json --form helm --namespace "$PROJECT" | tee "$RUNNER_TEMP/smoke.txt"; b=${PIPESTATUS[0]}
          [ "$a" = 0 ] && [ "$b" = 0 ]
      - name: Uninstall is clean
        if: always()
        run: |
          set -euo pipefail
          helm uninstall "$PROJECT" -n "$PROJECT" --wait
          kubectl -n "$PROJECT" delete pvc --all --wait
          left=$(kubectl -n "$PROJECT" get all,pvc -o name 2>/dev/null | grep -v '^service/kubernetes$' || true)
          [ -z "$left" ] || { echo "UNINSTALL=RED leftovers: $left"; exit 1; }
          echo "UNINSTALL=GREEN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-room-helm-evidence
          path: |
            ${{ runner.temp }}/helm-manifest.yaml
            ${{ runner.temp }}/*-refs.txt
            ${{ runner.temp }}/facts.json
            ${{ runner.temp }}/provenance-chain.txt
            ${{ runner.temp }}/smoke.txt

  upgrade-rollback:
    name: upgrade from the previous accepted bundle, then rollback (state equivalence)
    runs-on: ubuntu-24.04
    # D5 identity secrets are ENVIRONMENT secrets of `clean-room` (required reviewer), never repository secrets.
    environment: clean-room
    timeout-minutes: 60
    steps:
      - name: A previous ACCEPTED release bundle must exist
        run: |
          [ -n "${{ inputs.previous_bundle_run_id }}" ] && [ -n "${{ inputs.previous_bundle_sha256 }}" ] || {
            echo "::error::NO_PREVIOUS_ACCEPTED_BUNDLE: no accepted IntentGate release bundle exists yet, so upgrade and ROLLBACK_PROVEN cannot be GREEN"; exit 1; }
      - uses: actions/download-artifact@v4
        with: {name: "${{ inputs.bundle_artifact }}", path: "${{ runner.temp }}/new", run-id: "${{ inputs.bundle_run_id }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {pattern: "*.bundle", merge-multiple: true, path: "${{ runner.temp }}/prev", run-id: "${{ inputs.previous_bundle_run_id }}", github-token: "${{ github.token }}"}
      - uses: actions/download-artifact@v4
        with: {name: acceptance-kit, path: "${{ runner.temp }}/kitdl", run-id: "${{ inputs.bundle_run_id }}", github-token: "${{ github.token }}"}
      - name: Digests, extraction, credentials
        env:
          U: ${{ secrets.GHCR_READ_USER }}
          T: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "${{ inputs.bundle_sha256 }}  $(ls "$RUNNER_TEMP"/new/*.bundle.tgz)" | sha256sum -c -
          echo "${{ inputs.previous_bundle_sha256 }}  $(ls "$RUNNER_TEMP"/prev/*.bundle.tgz)" | sha256sum -c -
          echo "${{ inputs.kit_sha256 }}  $RUNNER_TEMP/kitdl/acceptance-kit.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/A" "$RUNNER_TEMP/B" "$RUNNER_TEMP/kit"
          tar -xzf "$RUNNER_TEMP"/prev/*.bundle.tgz -C "$RUNNER_TEMP/A"; tar -xzf "$RUNNER_TEMP"/new/*.bundle.tgz -C "$RUNNER_TEMP/B"
          tar -xzf "$RUNNER_TEMP/kitdl/acceptance-kit.tgz" -C "$RUNNER_TEMP/kit"
          python3 -m pip install --quiet cryptography==46.0.7 jsonschema==4.26.0
          echo "$T" | docker login ghcr.io -u "$U" --password-stdin
      - name: Install the previous accepted release (A), capture pre-upgrade state
        working-directory: ${{ runner.temp }}/A
        env:
          INTENTGATE_ENV_SEED: ${{ runner.temp }}/seed.env
          ISS: ${{ secrets.CLEANROOM_OIDC_ISSUER }}
          CID: ${{ secrets.CLEANROOM_OIDC_CLIENT_ID }}
          CSEC: ${{ secrets.CLEANROOM_OIDC_CLIENT_SECRET }}
          RCL: ${{ secrets.CLEANROOM_ROLE_CLAIM }}
          RMAP: ${{ secrets.CLEANROOM_ROLE_MAPPING }}
        run: |
          set -euo pipefail
          [ -n "$ISS" ] && [ -n "$RMAP" ] || { echo "::error::D5 undecided: no clean-room OIDC identity"; exit 1; }
          umask 077
          printf '%s\n' "AUTH_OIDC_ISSUER=$ISS" "AUTH_OIDC_CLIENT_ID=$CID" "AUTH_OIDC_CLIENT_SECRET=$CSEC" "AUTH_ROLE_CLAIM=$RCL" \
            "AUTH_ROLE_MAPPING=$RMAP" "CONSOLE_PRO_PUBLIC_URL=http://127.0.0.1:3000" \
            "INTENTGATE_PUBLIC_GATEWAY_URL=http://127.0.0.1:8080" "INTENTGATE_PLATFORM_GATEWAY_TENANT=cleanroom" > "$RUNNER_TEMP/seed.env"
          ./install.sh
          python3 release/release-manifest.py capture-state --form compose --project "$PROJECT" --install-dir . --out "$RUNNER_TEMP/pre.txt"
          docker compose -p "$PROJECT" exec -T postgres pg_dump -U intentgate -d intentgate -Fc > "$RUNNER_TEMP/pre-upgrade.dump"
      - name: Upgrade to the new release (B) with A's configuration; B's chain must be GREEN
        working-directory: ${{ runner.temp }}/B
        env:
          INTENTGATE_ACCEPT_UNRELEASABLE_CANDIDATE: ${{ inputs.candidate && '1' || '' }}
        run: |
          set -euo pipefail
          install -m 600 "$RUNNER_TEMP/A/.env" .env
          ./install.sh
          python3 release/acceptance-smoke.py --manifest release-manifest.json --form compose --project "$PROJECT"
      - name: Roll back to A (no down-migrations exist, so the pre-upgrade database is restored), capture post state
        working-directory: ${{ runner.temp }}/A
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/B" && docker compose -p "$PROJECT" down --remove-orphans)
          docker compose -p "$PROJECT" up -d postgres
          until docker compose -p "$PROJECT" exec -T postgres pg_isready -U intentgate -d intentgate -h 127.0.0.1; do sleep 2; done
          docker compose -p "$PROJECT" exec -T postgres psql -U intentgate -d postgres -c 'DROP DATABASE intentgate WITH (FORCE);' -c 'CREATE DATABASE intentgate OWNER intentgate;'
          docker compose -p "$PROJECT" exec -T postgres pg_restore -U intentgate -d intentgate --no-owner < "$RUNNER_TEMP/pre-upgrade.dump"
          ./install.sh
          python3 release/release-manifest.py capture-state --form compose --project "$PROJECT" --install-dir . --out "$RUNNER_TEMP/post.txt"
      - name: ROLLBACK_PROVEN - the existing comparator, state leg
        run: bash "$RUNNER_TEMP/kit/lkg-rollback-equivalence.sh" state "$RUNNER_TEMP/pre.txt" "$RUNNER_TEMP/post.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-room-upgrade-rollback-evidence
          path: |
            ${{ runner.temp }}/pre.txt
            ${{ runner.temp }}/post.txt
